services:
  # 1. TimescaleDB (Time-series PostgreSQL database)
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: sentinel_timescaledb
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-metrics_db}
    ports:
      - "5432:5432"
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    networks:
      - sentinel_net

  # 2. Prometheus (Scrapes metrics from microservices)
  prometheus:
    image: prom/prometheus:latest
    container_name: sentinel_prometheus
    restart: always
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=15d'
    ports:
      - "9090:9090"
    networks:
      - sentinel_net

  # 3. Grafana (Live Metrics Visualization Dashboards)
  grafana:
    image: grafana/grafana:latest
    container_name: sentinel_grafana
    restart: always
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
      - timescaledb
    networks:
      - sentinel_net

  # 4. User Microservice
  user_service:
    build:
      context: ./services/user_service
      dockerfile: Dockerfile
    container_name: sentinel_user_service
    restart: always
    ports:
      - "8001:8001"
    networks:
      - sentinel_net

  # 5. Order Microservice
  order_service:
    build:
      context: ./services/order_service
      dockerfile: Dockerfile
    container_name: sentinel_order_service
    restart: always
    ports:
      - "8002:8002"
    networks:
      - sentinel_net

  # 6. Payment Microservice
  payment_service:
    build:
      context: ./services/payment_service
      dockerfile: Dockerfile
    container_name: sentinel_payment_service
    restart: always
    ports:
      - "8003:8003"
    networks:
      - sentinel_net

  # 7. SentinelOps Backend & ML Engine
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: sentinel_backend
    restart: always
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-password}@timescaledb:5432/${POSTGRES_DB:-metrics_db}
      - PROMETHEUS_URL=http://prometheus:9090
      - COLLECTOR_INTERVAL_SECONDS=15
    ports:
      - "8000:8000"
    depends_on:
      - timescaledb
      - prometheus
    networks:
      - sentinel_net

volumes:
  timescaledb_data:
  grafana_data:

networks:
  sentinel_net:
    driver: bridge

