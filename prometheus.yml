global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "user_service"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["user_service:8001", "host.docker.internal:8001"]

  - job_name: "order_service"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["order_service:8002", "host.docker.internal:8002"]

  - job_name: "payment_service"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["payment_service:8003", "host.docker.internal:8003"]
