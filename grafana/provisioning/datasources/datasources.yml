apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true

  - name: TimescaleDB
    type: postgres
    access: proxy
    url: timescaledb:5432
    user: admin
    secureJsonData:
      password: password
    jsonData:
      database: metrics_db
      sslmode: disable
      postgresVersion: 1600
      timescaledb: true
    isDefault: false
    editable: true
